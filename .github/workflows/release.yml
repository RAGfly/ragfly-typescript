name: release

# Publica @ragfly/sdk a npm al pushear un tag vX.Y.Z, con Trusted Publishing
# (OIDC): npm valida que la publicación sale de ESTE workflow de ESTE repo, sin
# token guardado. La procedencia (provenance) se firma sola: repo y paquete son
# públicos.
#
# Forma canónica de release:
#   1. subir "version" en package.json
#   2. commit + push
#   3. git tag vX.Y.Z && git push origin vX.Y.Z
#
# Configuración del lado de npm (npmjs.com → @ragfly/sdk → Settings → Trusted
# publishing): GitHub Actions · RAGfly · ragfly-typescript · release.yml, con
# `npm publish` permitido. Si se renombra este archivo, hay que borrar y volver a
# crear esa conexión (el nombre se compara exacto). Requiere npm >= 11.5.1 y
# Node >= 22.14; los runners self-hosted no sirven.
on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write   # OIDC: lo exige Trusted Publishing
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # Sin caché en un build de release (recomendación de npm).
          package-manager-cache: false

      - name: npm con soporte de Trusted Publishing
        run: |
          npm install -g npm@11
          npm --version

      - name: Verificar que el tag coincide con la versión del paquete
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::El tag v$TAG no coincide con la versión $PKG de package.json"
            exit 1
          fi

      - name: Install + build
        run: |
          npm ci
          npm run build

      - name: Publish to npm (OIDC, sin token)
        run: npm publish --access public
